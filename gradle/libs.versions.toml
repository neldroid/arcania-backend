[versions]
exposed = "0.61.0"
h2 = "2.3.232"
postgres = "42.7.7"
kotlin = "2.3.0"
ktor = "3.2.3"
logback = "1.4.14"
kotlinxDatetime = "0.7.1"
kotlinxSerializationJSON = "1.9.0"
kotlinxCoroutines = "1.10.2"
koin = "4.1.0"
ksp = "2.2.21-2.0.5"
koog = "0.6.2"
firebaseAdmin = "9.8.0"
firestore = "26.1.2"
stripe = "29.1.0"
shadow = "8.3.10"

[libraries]
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
exposedCore = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposedJdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposedDao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposedDatetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }

ktorServerCore = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorServerContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktorServerHostCommon = { module = "io.ktor:ktor-server-host-common", version.ref = "ktor" }
ktorServerStatusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktorRequestValidation = { module = "io.ktor:ktor-server-request-validation", version.ref = "ktor" }
ktorRateLimit = { module = "io.ktor:ktor-server-rate-limit", version.ref = "ktor" }
ktorServerNetty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktorServerConfigYaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

ktorClientCore = { module = "io.ktor:ktor-client-cio", version.ref = "ktor"}
ktorClientContent = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor"}


koogAgents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koogTools = { module = "ai.koog:agents-tools", version.ref = "koog" }
koogFeatureEventHandler = { module = "ai.koog:agents-features-event-handler", version.ref = "koog" }

koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koinKtor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koinLogger = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }

firebaseAdmin = { module = "com.google.firebase:firebase-admin", version.ref = "firebaseAdmin" }
firebaseFirestore = { module = "com.google.firebase:firebase-firestore", version.ref = "firestore" }
stripe = { module = "com.stripe:stripe-java", version.ref = "stripe" }
[bundles]
kotlinxEcosystem = ["kotlinxSerialization", "kotlinxCoroutines"]
databaseEcosystem = ["postgresql", "h2", "exposedCore", "exposedJdbc", "exposedDao", "exposedDatetime"]
ktorEcosystem = ["ktorServerCore", "ktorSerializationKotlinxJson", "ktorServerContentNegotiation", "ktorServerHostCommon", "ktorServerStatusPages", "ktorServerNetty", "ktorServerConfigYaml", "logbackClassic", "ktorClientCore", "ktorClientContent", "ktorRequestValidation", "ktorRateLimit"]
koogEcosystem = ["koogAgents", "koogTools", "koogFeatureEventHandler"]
koinEcosystem = ["koinCore", "koinKtor", "koinLogger"]
firebaseEcosystem = ["firebaseAdmin"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow"}
